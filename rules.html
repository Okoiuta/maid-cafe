<style>
/* ===== 背景（跟菜單一樣） ===== */
body {
    margin: 0;
    font-family: Arial;

    background: url("bg.webp") no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
}

/* 暗層 */
body::before {
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:0;
}

body > * {
    position: relative;
    z-index: 1;
}

body {
    padding-top:70px;
}

/* ===== 標題（跟菜單一致） ===== */
.title {
    text-align:center;

    color:white;

}

/* ===== 區塊 ===== */
.section {
    max-width:900px;
    margin:30px auto;
}

/* ===== 卡片（跟 menu-box 一樣） ===== */
.menu-box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);

    border-radius:15px;
    padding:20px;
    margin-bottom:20px;

    color:white;

    box-shadow:0 4px 20px rgba(0,0,0,0.4);
}

/* 分類標題 */
.menu-box h2 {
    border-bottom:1px solid rgba(255,255,255,0.4);
    padding-bottom:10px;
}

/* 條列（像菜單項目） */
.item {
    margin:12px 0;
    font-size:18px;
}

/* 強調 */
.highlight {
    color:#ffd700;
    font-weight:bold;
}

.link {
    text-decoration: none;
    color: #ffd700;
    font-weight: bold;

    border-bottom: 2px solid rgba(255,215,0,0.6);
    transition: 0.2s;
}

.link:hover {
    color: white;
    border-bottom: 2px solid white;
}
</style>
</head>
