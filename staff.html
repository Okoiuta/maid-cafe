<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>員工介紹</title>

<style>

.prev { left: 10px; }
.next { right: 10px; }
body {
    padding-top: 70px;
    margin:0;
    font-family: Arial;
    background:#fafafa;
}
/* ===== 卡片牆 ===== */
.grid {
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px;
    padding:20px;
}

.card {
    position:relative;
    overflow:hidden;
    cursor:pointer;
}

.card img {
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    transition:0.3s;
}

.card:hover img {
    transform:scale(1.08);
}

/* Hover遮罩 */
.overlay {
    position:absolute;
    bottom:0;
    width:100%;
    padding:10px;
    color:white;
    background:linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    opacity:0;
    transition:0.3s;
}

.card:hover .overlay {
    opacity:1;
}

.name {
    font-size:14px;
    font-weight:bold;
}

.role {
    font-size:12px;
    opacity:0.8;
}

/* 手機永遠顯示 */
@media (hover:none){
    .overlay {
        opacity:1;
    }
}

/* RWD */
@media (max-width:900px){
    .grid { grid-template-columns:repeat(3,1fr); }
}

@media (max-width:500px){
    .grid { grid-template-columns:repeat(2,1fr); }
}

/* ===== Modal ===== */
.modal {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    z-index:999;
}

.modal-box {
    width:90%;
    max-width:1000px;
    height:80vh;
    margin:5vh auto;
    background:white;
    display:flex;
    border-radius:12px;
    overflow:hidden;
}

/* 左圖 */
.modal-left {
    width:60%;
    position:relative;
    background:black;
}

.modal-left img {
    width:100%;
    height:100%;
    object-fit:cover;
}

/* 右文 */
.modal-right {
    width:40%;
    padding:20px;
}

#modal-desc {
    white-space: pre-line;
    line-height: 1.8;
    word-break: break-word;
}

/* 關閉 */
.close {
    position: fixed;  
    top: 20px;
    right: 30px;
    font-size: 30px;
    color: black;
    cursor: pointer;
    z-index: 9999;
}
.nav-btn {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:30px;
    color:white;
    background:rgba(0,0,0,0.4);
    border:none;
    cursor:pointer;
    padding:10px;
}


.prev { left:10px; }
.next { right:10px; }

/* 手機版Modal */
@media (max-width:700px){

    .modal-box {
        flex-direction: column;

        width: 95%;
        height: auto;

        max-height: 90vh;
        overflow-y: auto;
    }

    /* 圖片區 */
    .modal-left {
        width: 100%;
        height: 55vh;

        flex-shrink: 0;
    }
    .modal-left img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* 文字區 */
    .modal-right {
        width: 100%;
        height: auto;

        padding: 20px;
        box-sizing: border-box;
    }

    /* 關閉按鈕 */
    .close {
        top: 10px;
        right: 15px;

        font-size: 28px;
        color: white;
    }

}

</style>
</head>

<body>
    
    <div class="nav">
    <a href="index.html">首頁</a>
    <a href="menu.html">菜單</a>
    <a href="staff.html">店員</a>
    <a href="rules.html">入店須知</a>
    <a href="reviews.html">留言</a>
</div>

<!-- ===== 卡片容器 ===== -->
<div class="grid" id="staff-grid"></div>

<!-- ===== Modal ===== -->
<div id="modal" class="modal">
    <span class="close">&times;</span>

    <div class="modal-box">
        <div class="modal-left">
            <img id="modal-img">

            <button class="nav-btn prev">‹</button>
            <button class="nav-btn next">›</button>
        </div>

        <div class="modal-right">
            <h2 id="modal-name"></h2>
            <h4 id="modal-role"></h4>
            <p id="modal-desc"></p>
        </div>
    </div>
</div>

<script>
/* ===== 1️⃣ 資料區（你只改這裡） ===== */
const staffData = [
    {
        name: "咕嘟咕嘟",
        role: "店長",
        desc: "咕嘟的意思是孤獨，社恐人，擅長獨處，其實很想交朋友，可惜語言表達能力非常薄弱。",
        images: [
            "img1.jpg",
            "img11.png"
        ]
    },
    {
        name: "白月",
        role: "店員",
        desc: "當年拉肥病毒襲來，所有人免疫力提升一萬倍，只有我保持不變。\n上一世身體被無影奪捨，海德林說要賺到300萬才能變回來。再次睜眼時，我回到了格里達尼亞，這一世我要奪回我的一切。",
        images: [
            "img2.png",
            "img21.png",
            "img22.png",
            "img23.png"
        ]
    },
    {
        name: "芳芳明",
        role: "店員",
        desc: "南洋出身森都成長的沙漠薯，常見於草叢。",
        images: [
            "img3.png",
            "img31.png"
        ]
    },
    {
        name: "Amauri",
        role: "店員",
        desc: "也可以叫我阿毛，我只是一個普普通通的小小拉肥，不擅長溝通。\n雖然人多會怕，但我還是會盡量跟大家溝通的。",
        images: [
            "img4.png",
            "img41.png"
        ]
    },
    {
        name: "巴巴羅薩",
        role: "店員",
        desc: "流落在黃金港的流浪惡魔，過著有一餐沒一餐的生活，因緣際會下到了森都加入惡魔幫，變的三餐都要靠人救濟。\n目前加入店長的咖啡廳靠著吃員工餐維生。",
        images: [
            "img5.png",
            "img51.png"
        ]
    },
    {
        name: "福利熊熊福利",
        role: "店員",
        desc: "我是新來的麋鹿惡魔(晃動鹿角)。如果客人太多我會當機或躲在角落，請原諒我…歡迎光臨。",
        images: [
            "img6.jpg",
            "img61.jpg"
        ]
    },
    {
        name: "娜娜莫",
        role: "女王",
        desc: "人民的智慧、人民的勇氣、人民的笑顏。\n只有人民的生命才是烏爾達哈無與倫比的至寶。",
        images: [
            "img7.png"
        ]
    },
    {
        name: "米米莉",
        role: "番茄國王",
        desc: "擁有無上的權力，可以將任何聲稱國王是顆蔬菜的人扔出窗外。",
        images: [
            "img8.png"
        ]
    },
    {
        name: "Maduk",
        role: "接待",
        desc: "沙都神秘出現的搓手怪貓。",
        images: [
            "img9.png",
            "img91.png",
            "img92.png",
            "img93.png",

        ]
    },
    {
        name: "Eevee",
        role: "長椅小妹",
        desc: "最可愛的長椅小妹，夢想是給全世界來上最可愛的一巴<3",
        images: [
            "img10.png",
            "img101.png",
            "img102.png",
            "img103.png",
            "img104.png"
        ]
    }

];

/* ===== 2️⃣ 生成卡片 ===== */
const grid = document.getElementById("staff-grid");

staffData.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    card.dataset.name = p.name;
    card.dataset.role = p.role;
    card.dataset.desc = p.desc;
    card.dataset.images = p.images.join(",");


    card.innerHTML = `
        <img src="${p.images[0]}">
        <div class="overlay">
            <div class="name">${p.name}</div>
            <div class="role">${p.role}</div>
        </div>
    `;

    grid.appendChild(card);
});

/* ===== 3️⃣ Modal邏輯 ===== */
const modal = document.getElementById("modal");
const img = document.getElementById("modal-img");
const nameBox = document.getElementById("modal-name");
const roleBox = document.getElementById("modal-role");
const descBox = document.getElementById("modal-desc");

let images = [];
let current = 0;

/* 點卡片 */
document.addEventListener("click", e => {
    const card = e.target.closest(".card");
    if (!card) return;

    images = card.dataset.images.split(",");
    current = 0;
    console.log(images);

    img.src = images[current];
    nameBox.innerText = card.dataset.name;
    roleBox.innerText = card.dataset.role;
    descBox.innerHTML = card.dataset.desc;

    modal.style.display = "block";
});

/* 關閉 */
document.querySelector(".close").onclick = () => {
    modal.style.display = "none";
};

/* 下一張 */
document.querySelector(".next").addEventListener("click", function() {
    if (images.length <= 1) return;

    current = (current + 1) % images.length;

    console.log("切換到:", images[current]); // 👈 看這裡

    img.src = images[current];
});

/* 上一張 */
document.querySelector(".prev").onclick = () => {
    current = (current - 1 + images.length) % images.length;
    img.src = images[current];
};
modal.addEventListener("click", function(e) {
    if (e.target === modal) {
        modal.style.display = "none";
    }
});
document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        modal.style.display = "none";
    }
});

window.addEventListener("DOMContentLoaded", function() {

    const modal = document.getElementById("modal");
    const img = document.getElementById("modal-img");
    const nameBox = document.getElementById("modal-name");
    const roleBox = document.getElementById("modal-role");
    const descBox = document.getElementById("modal-desc");

    let images = [];
    let current = 0;

    // 點卡片
    document.addEventListener("click", function(e) {
        const card = e.target.closest(".card");
        if (!card) return;

        if (!card.dataset.images) return;

        images = card.dataset.images.split(",");
        current = 0;

        img.src = images[current];
        nameBox.innerText = card.dataset.name;
        roleBox.innerText = card.dataset.role;
        descBox.innerText = card.dataset.desc;

        modal.style.display = "block";
    });

    // 下一張
    document.querySelector(".next").addEventListener("click", function() {
        current = (current + 1) % images.length;
        img.src = images[current];
    });

    // 上一張
    document.querySelector(".prev").addEventListener("click", function() {
        current = (current - 1 + images.length) % images.length;
        img.src = images[current];
    });

    // 關閉
    document.querySelector(".close").onclick = () => {
        modal.style.display = "none";
    };

    // 點背景關閉
    modal.addEventListener("click", function(e) {
        if (e.target === modal) {
            modal.style.display = "none";
        }
    });

    // ESC 關閉
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
            modal.style.display = "none";
        }
    });

});
</script>

</body>
</html>
