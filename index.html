<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

body {

    font-family: Arial;

    min-height: 100vh;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: -1;
}

#bg1,
#bg2{
    position:fixed;
    inset:0;

    background-size:cover;
    background-position:center center;

    opacity:0;

    transition:opacity 1.2s ease;

    pointer-events:none;

    z-index:-2;
}

#bg1.active,
#bg2.active{
    opacity:1;
}

.hero {
    height: 70vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor:pointer;
}

/* 主標題 */
.hero h1 {

    font-size: clamp(36px, 8vw, 64px);

    letter-spacing: 2px;

    color:white;

    text-align:center;

}
/* 副標題 */
.hero p {
    font-size: 28px;
    margin-top: 15px;

    color: white; /* ✅ 白字 */


    
}

.memory-wall {
    position: fixed;
    bottom: 0;
    width: 100%;
    overflow: hidden;
    background: rgba(0,0,0,0.6);
    padding: 10px 0;
}

.memory-track {
    display: flex;
    gap: 20px;
    width: max-content;

    animation: scroll 20s linear infinite;
}

.memory-track img{

    height:100px;

    border-radius:10px;

    cursor:pointer;

    transition:.3s;

}
.memory-track img:hover {
    transform: scale(1.1);
    transition: 0.3s;
}
.memory-wall::before,
.memory-wall::after {
    content: "";
    position: absolute;
    top: 0;
    width: 50px;
    height: 100%;
    z-index: 2;
}

.memory-wall::before {
    left: 0;
    background: linear-gradient(to right, black, transparent);
}

.memory-wall::after {
    right: 0;
    background: linear-gradient(to left, black, transparent);
}

.memory-wall:hover .memory-track{

    animation-play-state:paused;

}

@media (max-width:768px){

    .hero{
        min-height:60vh;
    }

}

/* 動畫：右 → 左 */
@keyframes scroll {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(-50%);
    }
}

#lightbox{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.9);

    z-index:9999;

    justify-content:center;

    align-items:center;

    cursor:pointer;

}

#lightbox img{

    max-width:90%;

    max-height:90%;

    border-radius:12px;

    box-shadow:0 0 30px rgba(255,255,255,0.3);

}

.carousel img{

    cursor:pointer;

    transition:.3s;

}

.carousel img:hover{

    transform:scale(1.03);

}


</style>

<script>

const lightbox =
    document.getElementById("lightbox");

const lightboxImg =
    document.getElementById("lightbox-img");

document.addEventListener("click",(e)=>{

    const img =
        e.target.closest(".memory-track img");

    if(!img) return;

    lightbox.style.display = "flex";
    lightboxImg.src = img.src;

});
const track =
    document.querySelector(".memory-track");

track.innerHTML += track.innerHTML;

lightbox.addEventListener("click",()=>{

    lightbox.style.display = "none";

});
document.body.addEventListener("click",(e)=>{

    if(
        e.target.closest(".memory-wall")
    ){
        return;
    }

    if(
        e.target.closest(".nav")
    ){
        return;
    }

    if(
        e.target.closest("#lightbox")
    ){
        return;
    }

    changeBackground();

});

const backgrounds = [
    "bg.webp",
    "bg2.webp",
    "bg3.webp",
    "bg4.webp",
    "bg5.webp",
    "bg6.webp",
    "bg7.webp",
    "bg8.webp",
];
backgrounds.forEach(src => {

    const img = new Image();

    img.src = src;

});

let currentLayer = 1;
let currentIndex = 0;

const bg1 = document.getElementById("bg1");
const bg2 = document.getElementById("bg2");

// 初始背景
bg1.style.backgroundImage =
    `url("${backgrounds[0]}")`;

bg1.classList.add("active");

function changeBackground(){

    let nextIndex;

    do{
        nextIndex =
            Math.floor(
                Math.random() *
                backgrounds.length
            );
    }
    while(
        nextIndex === currentIndex &&
        backgrounds.length > 1
    );

    currentIndex = nextIndex;

    const nextLayer =
        currentLayer === 1
        ? bg2
        : bg1;

    const currentBg =
        currentLayer === 1
        ? bg1
        : bg2;

    nextLayer.style.backgroundImage =
        `url("${backgrounds[nextIndex]}")`;

    nextLayer.classList.add("active");
    currentBg.classList.remove("active");

    currentLayer =
        currentLayer === 1 ? 2 : 1;


}


</script>
