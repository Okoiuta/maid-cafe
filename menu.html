<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>菜單</title>

<style>
/* ===== 背景 ===== */
html, body {
    margin: 0;
    height: 100%;
}

body {
    font-family: Arial;

    background: url("bg.webp") no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
}

/* 暗色遮罩 */
body::before {
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:0;
}

/* 讓內容在上層 */
body > * {
    position: relative;
    z-index: 1;
}

body {
    padding-top:70px;
}

/* ===== 標題 ===== */
.title {
    text-align:center;
    font-size:36px;
    color:white;

    text-shadow: 2px 2px 6px rgba(0,0,0,0.8);

    margin-top:20px;
}

/* ===== 區塊 ===== */
.section {
    max-width:900px;
    margin:30px auto;
}

/* ===== 卡片（玻璃感） ===== */
.menu-box {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);

    border-radius:15px;
    padding:20px;
    margin-bottom:20px;

    color:white;

    box-shadow:0 4px 20px rgba(0,0,0,0.4);
}

/* 分類標題 */
.menu-box h2 {
    border-bottom:1px solid rgba(255,255,255,0.4);
    padding-bottom:10px;
}

/* 項目 */
.item {
    display:flex;
    justify-content:space-between;
    margin:12px 0;

    text-shadow:1px 1px 4px rgba(0,0,0,0.8);
}

/* 套餐 */
.combo {
    text-align:center;
    font-size:20px;
    margin-top:10px;
}

/* 備註 */
.note {
    text-align: center;
    margin: 40px 0;

    color: white;
    font-size: 22px;   /* 🔥 放大 */

    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    padding-bottom:10px;
}

</style>
</head>

<body>

<!-- 導覽 -->
<div class="nav">

        <div class="item"><span>咖哩飯</span><span>2000</span></div>

    <div class="menu-box">

        <div class="item"><span>乳酪蛋糕</span><span>2000</span></div>
        <div class="item"><span>蘋果派</span><span>2000</span></div>
    </div>

    <div class="menu-box">
        <h2>飲品</h2>
        <div class="item"><span>咖啡</span><span>2000</span></div>

    <div class="menu-box">

</body>
</html>
